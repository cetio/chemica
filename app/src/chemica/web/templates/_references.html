<section class="panel references-panel" id="panel-references">
  <h2 class="panel-heading">References <span class="source-tag source-pubmed" title="PubMed">PM</span></h2>
  {% if references %}
  <ul class="reference-list">
    {% for ref in references %}
    <li class="reference-item">
      {% if ref.url %}
        <a href="{{ ref.url }}">{{ ref.title }}</a>
      {% else %}
        {{ ref.title }}
      {% endif %}
      {% if ref.snippet %}
      <details class="reference-detail">
        <summary><span class="reference-snippet">{{ ref.snippet }}</span></summary>
        <div class="reference-snippet">{{ ref.snippet }}</div>
      </details>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="fragment-decline">No PubMed literature found.</p>
  {% endif %}
</section>
