{% if figures %}
<div class="figure-strip" id="panel-figures">
  {% for fig in figures[:8] %}
  <a class="figure" href="https://en.wikipedia.org/wiki/File:{{ fig.file }}" target="_blank" rel="noopener" title="{{ fig.caption }}">
    <img src="/image/{{ fig.file | urlencode }}?width=280" alt="{{ fig.caption }}" loading="lazy">
  </a>
  {% endfor %}
</div>
{% endif %}
